<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Image Downloader</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; font-weight: bold;}
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .progress-wrapper { width: 100%; background-color: #e9ecef; border-radius: 5px; margin-top: 25px; display: none; overflow: hidden; height: 25px;}
        .progress-bar { width: 0%; height: 100%; background-color: #28a745; transition: width 0.2s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;}
        .status-text { margin-top: 15px; font-size: 14px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Batch Image Downloader</h2>
        <p>Upload your CSV or Excel file to download a ZIP of all images.</p>
        
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
        <button id="startBtn" onclick="processFile()">Start Download Process</button>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>

    <script>
        async function processFile() {
            const fileInput = document.getElementById('fileInput');
            const startBtn = document.getElementById('startBtn');
            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            if (!fileInput.files.length) {
                alert("Please select a CSV or Excel file first.");
                return;
            }

            const file = fileInput.files[0];
            
            // DYNAMIC ZIP NAMING
            const originalName = file.name;
            const baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
            const zipFileName = `${baseName}.zip`;

            startBtn.disabled = true;
            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';
            statusText.innerText = 'Reading file data...';

            try {
                // Extract data with explicitly renamed columns
                const data = await readFileData(file);
                if (data.length === 0) throw new Error("File is empty or only contains headers.");

                const zip = new JSZip();
                const downloadedUrls = new Set();
                let completed = 0;
                let successfulDownloads = 0;
                
                const total = data.length;

                for (let i = 0; i < total; i++) {
                    const skuId = data[i].SKU;
                    const url = data[i].IMAGE;

                    if (skuId && url && url.startsWith('http')) {
                        if (!downloadedUrls.has(url)) {
                            downloadedUrls.add(url);

                            statusText.innerText = `Fetching ${skuId}.jpg...`;
                            
                            try {
                                const response = await fetch(`/proxy?url=${encodeURIComponent(url)}`);
                                if (response.ok) {
                                    const blob = await response.blob();
                                    zip.file(`${skuId}.jpg`, blob); 
                                    successfulDownloads++;
                                } else {
                                    console.error(`Proxy rejected ${skuId}`);
                                }
                            } catch (err) {
                                console.error(`Network error for ${skuId}:`, err);
                            }
                        }
                    }

                    completed++;
                    const percentage = Math.round((completed / total) * 100);
                    progressBar.style.width = `${percentage}%`;
                    progressBar.innerText = `${percentage}%`;
                }

                if (successfulDownloads === 0) {
                    throw new Error("Zero images downloaded. Ensure Column A has SKUs and Column B has URLs.");
                }

                statusText.innerText = `Packaging ${zipFileName}...`;
                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, zipFileName); 
                
                statusText.innerText = `✅ Success! Downloaded ${successfulDownloads} images.`;
                
            } catch (error) {
                statusText.innerText = `Error: ${error.message}`;
                statusText.style.color = 'red';
            } finally {
                startBtn.disabled = false;
                fileInput.value = ''; 
            }
        }

        // Explicitly Renames Column A to SKU and Column B to IMAGE
        function readFileData(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        
                        // Read raw grid data
                        const rawGrid = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        if (rawGrid.length <= 1) return reject(new Error("File is empty or has no data rows."));

                        const formattedRows = [];
                        
                        // Start at i = 1 to skip the original headers entirely
                        for (let i = 1; i < rawGrid.length; i++) {
                            const row = rawGrid[i];
                            
                            // Skip completely blank rows to prevent crashes
                            if (!row || row.length === 0) continue;
                            
                            // Force Column A (index 0) to be SKU, Column B (index 1) to be IMAGE
                            formattedRows.push({
                                SKU: row[0] ? String(row[0]).trim() : null,
                                IMAGE: row[1] ? String(row[1]).trim() : null
                            });
                        }
                        
                        resolve(formattedRows);
                    } catch (err) {
                        reject(new Error("Invalid file format."));
                    }
                };
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
</html>
