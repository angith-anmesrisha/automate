<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Image Downloader</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        input[type="file"] { margin: 20px 0; }
        
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; font-weight: bold;}
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #reportBtn { background-color: #28a745; margin-top: 15px; display: none; }
        #reportBtn:hover { background-color: #218838; }
        
        .progress-wrapper { width: 100%; background-color: #e9ecef; border-radius: 5px; margin-top: 25px; display: none; overflow: hidden; height: 25px;}
        .progress-bar { width: 0%; height: 100%; background-color: #007bff; transition: width 0.2s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;}
        .status-text { margin-top: 15px; font-size: 14px; color: #555; font-weight: bold; }
        .error-text { margin-top: 15px; font-size: 14px; color: #dc3545; font-weight: bold; }
        
        .failed-list { margin-top: 10px; font-size: 13px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 5px; padding: 12px; text-align: left; max-height: 150px; overflow-y: auto; display: none; }
        .failed-list p { margin: 0 0 5px 0; font-weight: bold; }
        .failed-list ul { margin: 0; padding-left: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Batch Image Downloader</h2>
        <p>Upload your CSV or Excel file to download a ZIP of all images.</p>
        
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
        <button id="startBtn" onclick="processFile()">Start Download Process</button>
        
        <button id="reportBtn" onclick="downloadStandaloneReport()">Download Excel Report</button>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div class="status-text" id="statusText"></div>
        <div class="error-text" id="errorText"></div>
        <div class="failed-list" id="failedList"></div>
    </div>

    <script>
        let globalReportBlob = null;
        let globalReportFileName = "";

        async function processFile() {
            const fileInput = document.getElementById('fileInput');
            const startBtn = document.getElementById('startBtn');
            const reportBtn = document.getElementById('reportBtn');
            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const errorText = document.getElementById('errorText');
            const failedList = document.getElementById('failedList');

            if (!fileInput.files.length) {
                alert("Please select a CSV or Excel file first.");
                return;
            }

            const file = fileInput.files[0];
            const originalName = file.name;
            const baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
            const zipFileName = `${baseName}.zip`;

            startBtn.disabled = true;
            reportBtn.style.display = 'none'; 
            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';
            statusText.innerText = 'Reading file data...';
            errorText.innerText = ''; 
            failedList.style.display = 'none';
            failedList.innerHTML = '';
            globalReportBlob = null;

            try {
                const data = await readFileData(file);
                if (data.length === 0) throw new Error("File is empty or only contains headers.");

                const zip = new JSZip();
                let completed = 0;
                let successfulDownloads = 0;
                let failedDownloads = 0; 
                const failedSkus = []; 
                
                const reportRows = [["SKU", "Image_URL", "Status", "Details"]];
                
                const validRows = [];
                data.forEach(row => {
                    const rawSku = row.SKU ? String(row.SKU).trim() : null;
                    const rawUrl = row.IMAGE ? String(row.IMAGE).trim() : null;

                    if (rawSku) {
                        if (!rawUrl || !rawUrl.startsWith('http')) {
                            reportRows.push([rawSku, rawUrl || "N/A", "Skipped", "Missing or invalid URL format"]);
                        } else {
                            let processUrl = rawUrl;
                            if (processUrl.includes('drive.google.com')) {
                                const idMatch = processUrl.match(/id=([a-zA-Z0-9_-]+)/) || processUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                                if (idMatch && idMatch[1]) {
                                    processUrl = `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
                                }
                            }
                            validRows.push({ SKU: rawSku, IMAGE: processUrl, RAW_URL: rawUrl });
                        }
                    }
                });

                const total = validRows.length;
                if (total === 0) throw new Error("Zero valid images found to download.");

                const BATCH_SIZE = 15; 

                for (let i = 0; i < total; i += BATCH_SIZE) {
                    const batch = validRows.slice(i, i + BATCH_SIZE);
                    
                    statusText.innerText = `Fetching images ${i + 1} to ${Math.min(i + BATCH_SIZE, total)} of ${total}...`;

                    await Promise.all(batch.map(async (row) => {
                        const skuId = row.SKU;
                        const url = row.IMAGE;
                        
                        try {
                            // Back to the original stable proxy!
                            const response = await fetch(`/api/proxy?url=${encodeURIComponent(url)}`);
                            if (response.ok) {
                                const blob = await response.blob();
                                zip.file(`${skuId}.jpg`, blob); 
                                successfulDownloads++;
                                reportRows.push([skuId, row.RAW_URL, "Success", "Downloaded completely"]);
                            } else {
                                failedDownloads++;
                                failedSkus.push(skuId); 
                                reportRows.push([skuId, row.RAW_URL, "Failed", "Target server rejected access"]);
                            }
                        } catch (err) {
                            failedDownloads++;
                            failedSkus.push(skuId); 
                            reportRows.push([skuId, row.RAW_URL, "Failed", "Network error or timeout"]);
                        }
                        
                        completed++;
                        const percentage = Math.round((completed / total) * 100);
                        progressBar.style.width = `${percentage}%`;
                        progressBar.innerText = `${percentage}%`;
                    }));
                }

                statusText.innerText = `Packaging ${zipFileName} with Excel Report...`;
                
                const ws = XLSX.utils.aoa_to_sheet(reportRows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Summary Report");
                
                const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const excelBlob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                
                zip.file(`${baseName}_Summary_Report.xlsx`, excelBlob);

                globalReportBlob = excelBlob;
                globalReportFileName = `${baseName}_Summary_Report.xlsx`;

                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, zipFileName); 
                
                statusText.innerText = `Success! Downloaded ${successfulDownloads} images.`;
                
                reportBtn.style.display = 'block';
                
                if (failedDownloads > 0) {
                    errorText.innerText = `Warning: ${failedDownloads} images failed to download due to broken links or restricted permissions.`;
                    
                    let listHtml = '<p>Failed SKUs:</p><ul>';
                    failedSkus.forEach(sku => {
                        listHtml += `<li>${sku}</li>`;
                    });
                    listHtml += '</ul>';
                    
                    failedList.innerHTML = listHtml;
                    failedList.style.display = 'block'; 
                }
                
            } catch (error) {
                statusText.innerText = `Error: ${error.message}`;
                statusText.style.color = 'red';
            } finally {
                startBtn.disabled = false;
                fileInput.value = ''; 
            }
        }

        function downloadStandaloneReport() {
            if (globalReportBlob && globalReportFileName) {
                saveAs(globalReportBlob, globalReportFileName);
            }
        }

        function readFileData(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rawGrid = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        
                        if (rawGrid.length <= 1) return reject(new Error("File is empty or has no data rows."));

                        const formattedRows = [];
                        for (let i = 1; i < rawGrid.length; i++) {
                            const row = rawGrid[i];
                            if (!row || row.length === 0) continue;
                            
                            formattedRows.push({
                                SKU: row[0] ? String(row[0]).trim() : null,
                                IMAGE: row[1] ? String(row[1]).trim() : null
                            });
                        }
                        resolve(formattedRows);
                    } catch (err) {
                        reject(new Error("Invalid file format."));
                    }
                };
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
</html>
